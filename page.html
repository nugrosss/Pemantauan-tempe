
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0"> 
  <title>Dashboard Tempe</title>
  <!-- <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"> -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
   <header class="header" style="position: relative; height: 60px;">
      <img src="1753185805088.png" alt="Logo" style="height: 50px; position: absolute; left: 50px; top: 20px;">
      <h1 style="text-align: center; margin: 0; line-height: 60px;">Dashboard Pemantauan Tempe</h1>
   </header>



  <div class="dashboard-container">
    <div class="sidebar">
      <div class="box">
        <p>Suhu<br><strong id="suhu">-- °C</strong></p>
      </div>
      <div class="box">
        <p>Kelembapann<br><strong id="kelembapan">-- %</strong></p> <!-- ✅ ID diperbaiki -->
      </div>
      <div class="box">
        <button onclick="history()">History</button>
      </div>
    </div>
    <div class="main-content">

    <div style="text-align: center; margin-bottom: 20px; background-color: #e0ffe0; border: 2px solid #2ecc71; padding: 10px; border-radius: 10px;">
        <h2 style="color: #2ecc71;">Tempe Bagus</h2>
        <img id="imgBagus1" src="upload_gambar/terbaru/Tempe bagus.jpg"  width="320" height="240" alt="Tempe Bagus" style="border: 4px solid #2ecc71; border-radius: 10px;" />
         <div id="waktuBagus">Terakhir diperbarui: -</div>
    </div>

    <div style="text-align: center; margin-bottom: 20px; background-color: #ffe0e0; border: 2px solid #e74c3c; padding: 10px; border-radius: 10px;">
        <h2 style="color: #e74c3c;">Tempe Gagal</h2>
        <img id="imgJelek1" src="upload_gambar/terbaru/Tempe jelek.jpg" width="320" height="240" alt="Tempe Gagal" style="border: 4px solid #e74c3c; border-radius: 10px;" />
        <div id="waktuJelek">Terakhir diperbarui: -</div>
    </div>
    

</div>

  </div>
  <script src="script.js"></script>
</body>
</html>
